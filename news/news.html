<!-- 假设这是您原有的 news.html 结构 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>News & Articles - MBORMC</title>
    <!-- 其他 meta, css, font-awesome 等保持不变 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 保留您原有的所有样式，或者 link 到全局 CSS */
        /* 这里只需要确保 .product-grid 等类存在即可 */
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">...</nav>

    <!-- 页面主体 -->
    <section class="products-section">
        <div class="container">
            <div class="section-head">
                <h2>📰 Latest News & Articles</h2>
                <p>DIY tips, product updates, and industry insights</p>
            </div>
            <!-- 动态文章列表容器 -->
            <div id="news-list-container" class="product-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
                <!-- 这里会被 JavaScript 动态填充 -->
                <div style="text-align: center; grid-column: 1/-1;">加载文章中...</div>
            </div>
        </div>
    </section>

    <!-- 页脚等其他内容 -->
    <footer class="footer">...</footer>

    <script>
        // 动态加载 articles.json 并渲染
        fetch('/articles.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to fetch');
                return response.json();
            })
            .then(articles => {
                const container = document.getElementById('news-list-container');
                if (!container) return;
                if (articles.length === 0) {
                    container.innerHTML = '<div style="grid-column:1/-1; text-align:center;">暂无文章，敬请期待。</div>';
                    return;
                }
                container.innerHTML = articles.map(article => `
                    <a href="${article.link}" class="product-card" style="display: flex; flex-direction: column; text-decoration: none; padding: 1.2rem;">
                        <h3 style="color: var(--primary-dark, #c68912); margin-bottom: 0.5rem;">${escapeHtml(article.title)}</h3>
                        <p style="color: var(--text-muted, #475569); font-size: 0.9rem; margin-bottom: 1rem;">${escapeHtml(article.description)}</p>
                        <div style="margin-top: auto; font-size: 0.8rem; color: #94a3b8;">
                            <i class="far fa-calendar-alt"></i> ${article.date}
                        </div>
                    </a>
                `).join('');
            })
            .catch(error => {
                console.error('加载文章列表出错:', error);
                const container = document.getElementById('news-list-container');
                if (container) {
                    container.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">加载失败，请刷新页面重试。</div>';
                }
            });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
