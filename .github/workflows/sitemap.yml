name: Generate Sitemap for insectscreen.cc

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main          # ⚠️ 請根據您的 Pages 部署分支修改（main / master / gh-pages）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main      # 與上方 branches 保持一致

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://www.insectscreen.cc/
          include-html: true
          exclude-paths: |
            /404.html
            /assets/
            /images/
            /css/
            /js/
            /fonts/
            /CNAME
            /README.md
            /.git/
            /.github/
            /node_modules/

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit and push sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-generate sitemap.xml"
          git push
